# selendroid-test-app / Appium settings. Override any key with -D<key>=<value> or an environment
# variable (dots -> underscores, upper-case), e.g. -Dmobile.udid=emulator-5556 or MOBILE_APPIUM_URL=...

# ---- Appium server ----
mobile.appium.url=http://127.0.0.1:4723

# ---- Device ----
mobile.platform.name=Android
mobile.automation.name=UiAutomator2
mobile.device.name=Android Emulator
# Optional: pin a device when several are connected (adb devices), e.g. emulator-5556
mobile.udid=
# Optional: require an Android version, e.g. 11. Empty = any.
mobile.platform.version=

# ---- App under test ----
# Classpath location of the APK (resolved to an absolute path at run time)
mobile.app.path=apps/selendroid-test-app.apk
mobile.app.package=io.selendroid.testapp
mobile.app.activity=.HomeScreenActivity
# The app targets SDK 10; grant its permissions at install time so Android's
# permission-review screen is skipped where the OS allows it.
mobile.auto.grant.permissions=true

# ---- Timeouts ----
# Default explicit wait for elements
mobile.timeout.explicit=15s
# Toasts live ~2s, so they are polled quickly with a short budget
mobile.timeout.toast=5s
mobile.timeout.toast.poll=100ms
# The progress dialog runs for a few seconds before opening the registration screen
mobile.timeout.progress=30s
# How long to wait for a WEBVIEW context to appear
mobile.timeout.webview=20s
# Short probe used to check for optional system dialogs after launch
mobile.timeout.dialog.probe=2s
mobile.timeout.new.command=120s
# Generous: the first session installs the UiAutomator2 server APKs (slow on CI emulators)
mobile.timeout.server.install=120s
mobile.timeout.adb.exec=60s

# ---- Reporting ----
# Number of logcat lines attached to the report when a scenario fails
mobile.logcat.lines=200
