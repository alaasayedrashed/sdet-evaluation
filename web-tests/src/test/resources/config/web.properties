# jqueryui.com / Playwright settings. Override any key with -D<key>=<value> or an environment
# variable (dots -> underscores, upper-case), e.g. -Dweb.headless=false or WEB_BROWSER=firefox.

web.base.url=https://jqueryui.com/

# chromium | firefox | webkit
web.browser=chromium
web.headless=true
# Slows every Playwright action down, handy for live demos: -Dweb.slow.mo=500ms
web.slow.mo=0ms
web.viewport.width=1440
web.viewport.height=900

# Upper bound for Playwright's auto-waiting (actions, locators) and for page navigation
web.timeout.default=15s
web.timeout.navigation=30s
# Evidence capture gets its own budget so a failing test can still be screenshotted
web.timeout.screenshot=10s

# Intermediate mouse moves for drag operations; jQuery UI needs real mousemove events
web.drag.steps=15

# Reporting
web.trace.on.failure=true
web.artifacts.dir=target/playwright
