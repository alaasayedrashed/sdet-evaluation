# reqres.in API settings. Override any key with -D<key>=<value> or an environment
# variable (dots -> underscores, upper-case), e.g. API_KEY=my-key.

api.base.uri=https://reqres.in
api.base.path=/api

# reqres.in documents a free key sent as "x-api-key". At the time of writing (2026-10-07) the
# public endpoints answer with or without it; we send it so the suite keeps working if the
# key becomes mandatory again. Disable with -Dapi.key.enabled=false.
api.key.enabled=true
api.key.header=x-api-key
api.key=reqres-free-v1

api.timeout.connect=10s
api.timeout.read=30s
