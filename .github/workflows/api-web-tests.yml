name: API & Web Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  api-web:
    name: API (REST Assured) + Web (Playwright)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Official Playwright Java image (same as the Dockerfile): JDK 25, Maven and browsers
    # preinstalled, so there is no JDK, browser or OS-package install step
    container:
      image: mcr.microsoft.com/playwright/java:v1.63.0-noble
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: /github/home/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Run API and Web tests (headless)
        run: ./mvnw -B -ntp -fae test -pl api-tests,web-tests -am -Dweb.headless=true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api-web
          path: allure-results
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright traces and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-api-diagnostics
          path: |
            web-tests/target/playwright/traces
            */target/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate Allure report (single file)
        if: always()
        run: ./mvnw -B -ntp -N allure:report -Dallure.single.file=true

      - name: Upload Allure report (open index.html)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-api-web
          path: allure-report/index.html
          if-no-files-found: warn
          retention-days: 14
